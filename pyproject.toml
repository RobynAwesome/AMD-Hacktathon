[project]
name = "goa-creative-commerce"
version = "0.1.0"
description = "GOA Creative Commerce: imagine freely, ground every part, surface unmet demand."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"
